<!doctype html>
<html lang="nb" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Oppgavetavle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7cff'/%3E%3Crect x='12' y='14' width='16' height='36' rx='4' fill='white'/%3E%3Crect x='36' y='14' width='16' height='22' rx='4' fill='white' opacity='.85'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%234f7cff'/%3E%3Crect x='12' y='14' width='16' height='36' rx='4' fill='white'/%3E%3Crect x='36' y='14' width='16' height='22' rx='4' fill='white' opacity='.85'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Oppgavetavle","short_name":"Oppgaver","start_url":".","display":"standalone","background_color":"%230f1115","theme_color":"%234f7cff","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%234f7cff%27/%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml","purpose":"any"}]}'>
<style>
:root{
  --bg:#eef0f4;--surface:#ffffff;--col:#e4e7ee;--text:#1b1f29;--muted:#667085;--line:#d5d9e3;
  --accent:#4f7cff;--accent-text:#ffffff;--danger:#d92d20;--shadow:0 1px 2px rgba(16,24,40,.12);
  --overlay:rgba(16,24,40,.45);
}
@media (prefers-color-scheme:dark){
  :root[data-theme=auto]{--bg:#0f1115;--surface:#1e222b;--col:#171a21;--text:#e8eaf0;--muted:#98a2b3;--line:#2c313c;--shadow:0 1px 2px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6)}
}
:root[data-theme=dark]{--bg:#0f1115;--surface:#1e222b;--col:#171a21;--text:#e8eaf0;--muted:#98a2b3;--line:#2c313c;--shadow:0 1px 2px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;min-height:80px}
.hidden{display:none!important}

/* Appramme */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:nowrap}
header .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}
.btn.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#boardBtn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}

/* Tavle */
#board{flex:1;display:flex;gap:12px;padding:12px;overflow-x:auto;overflow-y:hidden;align-items:flex-start;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{flex:none;width:min(84vw,320px);background:var(--col);border-radius:12px;max-height:100%;display:flex;flex-direction:column;scroll-snap-align:start}
.col-h{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px}
.col-h h3{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .count{color:var(--muted);font-size:12px}
.col-h button{border:0;background:transparent;border-radius:6px;padding:2px 8px;font-size:18px;color:var(--muted)}
.cards{padding:4px 8px;overflow-y:auto;min-height:48px;display:flex;flex-direction:column;gap:8px;flex:0 1 auto}
.card{background:var(--surface);border-radius:8px;padding:10px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;word-break:break-word}
.card:hover{border-color:var(--accent)}
.card.ghost{opacity:.4}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card.chosen{box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sortable-fallback{opacity:.95!important;transform:rotate(2deg);box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:300}
body.dragging{cursor:grabbing}
body.dragging #board{scroll-snap-type:none}
.card .lbl{display:inline-block;height:8px;width:36px;border-radius:4px;margin-bottom:6px}
.card .t{font-weight:500}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:6px;background:var(--col)}
.chip.over{background:var(--danger);color:#fff}
.chip.done{background:#12b76a;color:#fff}
.meta .sp{flex:1}
.add{padding:8px}
.add>button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px}
.add>button:hover{background:rgba(127,127,127,.15)}
.add form{display:flex;flex-direction:column;gap:6px}
.add form .row{display:flex;gap:6px}
.newcol{flex:none;width:min(84vw,320px)}
.newcol button{width:100%;padding:12px;border:2px dashed var(--line);background:transparent;border-radius:12px;color:var(--muted);font-weight:600}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 20px}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.25)}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:16px}}
.modal h2{margin:0 0 12px;font-size:17px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.titlein{font-size:18px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.labels{display:flex;gap:8px;flex-wrap:wrap}
.labels button{width:34px;height:26px;border-radius:6px;border:2px solid transparent}
.labels button.sel{border-color:var(--text)}
.labels button.none{background:var(--col);font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;padding:4px 0}
.check input[type=checkbox]{width:20px;height:20px;flex:none}
.check span{flex:1;word-break:break-word}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check button{border:0;background:transparent;color:var(--muted);font-size:18px}
.bar{display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.sheet button.opt{display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px}
.sheet button.opt.danger{color:var(--danger)}
.sheet button.opt.cur{font-weight:700;color:var(--accent)}

/* Søk, kolonnefarge, WIP, aktivitet */
.searchbar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.searchbar input{flex:1}
.col{border-top:4px solid var(--colc,transparent)}
.col-h .count.full{color:var(--danger);font-weight:700}
.col.wipfull{outline:2px solid var(--danger);outline-offset:-2px}
.chip.soon{background:#f5871f;color:#fff}
.colors button.none{background:var(--col);font-size:11px;color:var(--muted);border-radius:50%}
.act{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);word-break:break-word}
.act small{color:var(--muted);display:block}
.act.kommentar{background:var(--col);border-radius:8px;padding:8px;margin-bottom:6px;border:0}
.remember{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px}
.remember input{width:18px;height:18px;flex:none}
/* Bilder */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--col)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.photobtns{display:flex;gap:8px;flex-wrap:wrap}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:grid;place-items:center;padding:12px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;font-size:20px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff}
/* Innlogging */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:100;overflow:auto}
.lbox{width:100%;max-width:380px;background:var(--surface);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.lbox h1{margin:0 0 4px;font-size:22px}
.lbox p{margin:0 0 16px;color:var(--muted)}
.users{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.user{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;background:var(--col);border-radius:12px;padding:12px 10px;min-width:84px}
.user.sel{border-color:var(--accent)}
.user .avatar{width:44px;height:44px;font-size:18px}
.err{color:var(--danger);min-height:20px;margin:6px 0;font-size:13px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button.sel{border-color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw}
</style>
</head>
<body>
<div id="login" class="hidden"></div>
<div id="app" class="hidden">
  <header>
    <button id="boardBtn" class="btn grow" title="Bytt tavle"></button>
    <button id="searchBtn" class="btn icon" title="Søk" aria-label="Søk">🔍</button>
    <button id="mineBtn" class="btn" title="Vis bare mine oppgaver">Mine</button>
    <button id="themeBtn" class="btn icon" title="Tema"></button>
    <button id="meBtn" class="btn icon" title="Meg"></button>
    <button id="logoutBtn" class="btn icon" title="Logg ut" aria-label="Logg ut">⎋</button>
  </header>
  <div id="searchBar" class="searchbar hidden"><input id="searchIn" type="search" placeholder="Søk i tittel, beskrivelse og sjekkliste …" autocomplete="off"><button id="searchClear" class="btn">Lukk</button></div>
  <div id="board"></div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const SB_URL = 'https://xhvbblbyyyejgyybikme.supabase.co';
const SB_KEY = 'sb_publishable_H75DAfijNq_6K5zGRmEOQA_bC429A9P';
// Egen fetch: sender vanlige objekter i stedet for Headers/AbortSignal, slik at appen også fungerer i sandkasse-forhåndsvisninger (postMessage kan ikke klone Headers).
const plainFetch = (input, init = {}) => {
  const headers = {};
  new Headers(init.headers || {}).forEach((v, k) => { headers[k] = v; });
  const { signal, ...rest } = init;
  return fetch(typeof input === 'string' ? input : String(input && input.url ? input.url : input), { ...rest, headers });
};
const sb = supabase.createClient(SB_URL, SB_KEY, { global: { fetch: plainFetch } });

const LABELS = [
  {k:'rod',c:'#e5484d',n:'Haster'},{k:'oransje',c:'#f5871f',n:'Viktig'},{k:'gul',c:'#e5b400',n:'Venter'},
  {k:'gronn',c:'#12b76a',n:'Grei'},{k:'bla',c:'#2e90fa',n:'Info'},{k:'lilla',c:'#7a5af8',n:'Idé'}
];
const COLORS = ['#4f7cff','#e5484d','#f5871f','#12b76a','#7a5af8','#0ba5ec','#d444a0','#667085'];
const STEP = 1000;

let me = null, users = [], boards = [], boardId = null, cols = [], cards = [];
let query = '', activity = [], files = [], onlyMine = false, dragging = false, lastDrop = 0, openCardId = null, channel = null, loadTimer = null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = n => (n || '?').trim().charAt(0).toUpperCase();
const userById = id => users.find(u => u.id === id);
function avatar(u, size) {
  if (!u) return '';
  const st = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;` : '';
  return `<span class="avatar" style="background:${esc(u.farge)};${st}" title="${esc(u.navn)}">${esc(initial(u.navn))}</span>`;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800);
}
function fail(error, what) { if (error) { console.error(error); toast(`Feil: ${what || error.message}`); return true; } return false; }
const sess = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: k => { try { sessionStorage.removeItem(k); } catch {} } };
function saveMe(remember) { store.del('oppg_meg'); sess.del('oppg_meg'); (remember ? store : sess).set('oppg_meg', JSON.stringify(me)); store.set('oppg_husk', remember ? '1' : '0'); }
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };

/* ---------- Tema ---------- */
const THEMES = ['auto', 'light', 'dark'];
const THEME_ICON = { auto: '◐', light: '☀', dark: '☾' };
const THEME_NAME = { auto: 'Auto', light: 'Lys', dark: 'Mørk' };
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#themeBtn'); b.textContent = THEME_ICON[t]; b.title = 'Tema: ' + THEME_NAME[t];
}
function cycleTheme() {
  const cur = store.get('oppg_tema') || 'auto';
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  store.set('oppg_tema', next); applyTheme(next); toast('Tema: ' + THEME_NAME[next]);
}

/* ---------- Generiske dialoger ---------- */
function closeModal() { $('#modalRoot').innerHTML = ''; openCardId = null; }
function showModal(html, onClose) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`;
  const ov = $('.overlay', root);
  ov.addEventListener('mousedown', e => { if (e.target === ov) { closeModal(); onClose && onClose(); } });
  return $('.modal', root);
}
function sheet(title, options) {
  const m = showModal(`<h2>${esc(title)}</h2><div class="sheet">${options.map((o, i) =>
    `<button class="opt ${o.danger ? 'danger' : ''} ${o.cur ? 'cur' : ''}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`);
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { closeModal(); options[+b.dataset.i].fn(); });
}

/* ---------- Innlogging ---------- */
async function showLogin() {
  $('#app').classList.add('hidden');
  const box = $('#login'); box.classList.remove('hidden');
  box.innerHTML = '<div class="lbox"><p>Laster …</p></div>';
  const { data, error } = await sb.rpc('oppg_brukere_liste');
  if (error) { box.innerHTML = `<div class="lbox"><h1>Oppgavetavle</h1><p class="err">Kunne ikke koble til: ${esc(error.message)}</p></div>`; return; }
  users = data || [];
  if (users.length === 0) return showCreateUser(true);
  let sel = null;
  const draw = () => {
    box.innerHTML = `<div class="lbox"><h1>Oppgavetavle</h1><p>Hvem er du?</p>
      <div class="users">${users.map(u => `<button class="user ${sel === u.id ? 'sel' : ''}" data-id="${u.id}">${avatar(u)}<span>${esc(u.navn)}</span></button>`).join('')}</div>
      ${sel ? `<form id="pinForm"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN-kode" autofocus>
      <label class="remember"><input type="checkbox" id="remember" ${store.get('oppg_husk') !== '0' ? 'checked' : ''}> Husk meg på denne enheten</label>
      <div class="err" id="err"></div><button class="btn primary" style="width:100%">Logg inn</button></form>` : ''}</div>`;
    box.querySelectorAll('.user').forEach(b => b.onclick = () => { sel = b.dataset.id; draw(); });
    const f = $('#pinForm', box);
    if (f) {
      $('#pin', box).focus();
      f.onsubmit = async e => {
        e.preventDefault();
        const u = userById(sel);
        const { data, error } = await sb.rpc('oppg_logg_inn', { p_navn: u.navn, p_pin: $('#pin', box).value });
        if (error || !data || !data.length) { $('#err', box).textContent = 'Feil PIN-kode'; $('#pin', box).select(); return; }
        me = data[0]; saveMe($('#remember', box).checked); box.classList.add('hidden'); start();
      };
    }
  };
  draw();
}
function showCreateUser(first) {
  const box = $('#login'); box.classList.remove('hidden');
  let farge = COLORS[0];
  box.innerHTML = `<div class="lbox"><h1>${first ? 'Velkommen!' : 'Ny person'}</h1>
    <p>${first ? 'Lag den første brukeren. Flere kan legges til etterpå.' : 'Legg til en person som skal bruke tavlen.'}</p>
    <form id="nyForm"><div class="field"><label>Navn</label><input id="nNavn" required maxlength="30"></div>
    <div class="field"><label>PIN-kode (minst 4 tegn)</label><input id="nPin" type="password" inputmode="numeric" minlength="4" required></div>
    <div class="field"><label>Farge</label><div class="colors">${COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${c === farge ? 'sel' : ''}"></button>`).join('')}</div></div>
    <div class="err" id="err"></div><button class="btn primary" style="width:100%">${first ? 'Opprett og start' : 'Legg til'}</button></form></div>`;
  box.querySelectorAll('.colors button').forEach(b => b.onclick = () => { farge = b.dataset.c; box.querySelectorAll('.colors button').forEach(x => x.classList.toggle('sel', x === b)); });
  $('#nyForm', box).onsubmit = async e => {
    e.preventDefault();
    const { data, error } = await sb.rpc('oppg_ny_bruker', { p_navn: $('#nNavn', box).value, p_pin: $('#nPin', box).value, p_farge: farge });
    if (error) { $('#err', box).textContent = error.message.includes('duplicate') ? 'Navnet er tatt' : error.message; return; }
    me = data[0]; saveMe(true); box.classList.add('hidden'); start();
  };
}
function addPerson() {
  const m = showModal(`<h2>Legg til person</h2><form id="apForm">
    <div class="field"><label>Navn</label><input id="apNavn" required maxlength="30"></div>
    <div class="field"><label>PIN til den nye (minst 4 tegn)</label><input id="apPin" type="password" inputmode="numeric" minlength="4" required></div>
    <div class="field"><label>Din egen PIN (for å bekrefte)</label><input id="apMy" type="password" inputmode="numeric" required></div>
    <div class="field"><label>Farge</label><div class="colors">${COLORS.map((c, i) => `<button type="button" data-c="${c}" style="background:${c}" class="${i === 1 ? 'sel' : ''}"></button>`).join('')}</div></div>
    <div class="err" id="apErr"></div><div class="bar"><button type="button" class="btn" id="apCancel">Avbryt</button><button class="btn primary">Legg til</button></div></form>`);
  let farge = COLORS[1];
  m.querySelectorAll('.colors button').forEach(b => b.onclick = () => { farge = b.dataset.c; m.querySelectorAll('.colors button').forEach(x => x.classList.toggle('sel', x === b)); });
  $('#apCancel', m).onclick = closeModal;
  $('#apForm', m).onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.rpc('oppg_ny_bruker', { p_navn: $('#apNavn', m).value, p_pin: $('#apPin', m).value, p_farge: farge, p_admin_navn: me.navn, p_admin_pin: $('#apMy', m).value });
    if (error) { $('#apErr', m).textContent = error.message.includes('duplicate') ? 'Navnet er tatt' : (error.message.includes('Ikke tillatt') ? 'Feil PIN' : error.message); return; }
    closeModal(); await loadUsers(); render(); toast('Person lagt til');
  };
}
function logout() { store.del('oppg_meg'); sess.del('oppg_meg'); me = null; query = ''; activity = []; files = []; $('#searchBar').classList.add('hidden'); $('#searchIn').value = ''; if (channel) { sb.removeChannel(channel); channel = null; } showLogin(); }

/* ---------- Data ---------- */
async function loadUsers() { const { data, error } = await sb.rpc('oppg_brukere_liste'); if (!fail(error)) users = data || []; }
async function loadBoards() {
  const { data, error } = await sb.from('oppg_tavler').select('*').order('posisjon').order('opprettet');
  if (fail(error)) return;
  boards = data || [];
  if (!boards.length) { await createBoard('Hjem', true); return; }
  if (!boards.find(b => b.id === boardId)) boardId = store.get('oppg_tavle');
  if (!boards.find(b => b.id === boardId)) boardId = boards[0].id;
}
async function createBoard(navn, silent) {
  const { data, error } = await sb.from('oppg_tavler').insert({ navn, posisjon: boards.length }).select().single();
  if (fail(error)) return;
  await sb.from('oppg_kolonner').insert(['Å gjøre', 'Pågår', 'Ferdig'].map((t, i) => ({ tavle_id: data.id, tittel: t, posisjon: (i + 1) * STEP })));
  boards.push(data); boardId = data.id; store.set('oppg_tavle', boardId);
  await loadBoard(); if (!silent) toast('Tavle opprettet');
}
async function loadBoard() {
  if (!boardId) return;
  const [c, k] = await Promise.all([
    sb.from('oppg_kolonner').select('*').eq('tavle_id', boardId).order('posisjon'),
    sb.from('oppg_kort').select('*').eq('tavle_id', boardId).order('posisjon')
  ]);

}
function scheduleLoad() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(async () => {
    if (dragging) return scheduleLoad();

    if (openCardId && !cards.find(c => c.id === openCardId)) closeModal();
  }, 200);
}
function subscribe() {
  try {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('oppg-live');
    ['oppg_kort', 'oppg_kolonner', 'oppg_tavler', 'oppg_aktivitet', 'oppg_vedlegg'].forEach(t => channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, scheduleLoad));
    channel.subscribe();
  } catch (e) { console.warn('Sanntid ikke tilgjengelig her – oppdater siden for å se andres endringer', e); }
}
async function start() {
  $('#app').classList.remove('hidden');

  await loadUsers(); await loadBoards(); await loadBoard(); subscribe();
}

/* ---------- Bilder ---------- */
const BUCKET = 'oppg-bilder';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const fileUrl = f => sb.storage.from(BUCKET).getPublicUrl(f.sti).data.publicUrl;
async function loadFiles() {
  if (!boardId) return;
  const { data, error } = await sb.from('oppg_vedlegg').select('*').eq('tavle_id', boardId).order('opprettet');
  if (!error) files = data || [];
}
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('Kunne ikke behandle bildet')), 'image/jpeg', 0.82));
}
async function addPhotos(cardId, list) {
  const card = cards.find(c => c.id === cardId); if (!card) return;
  let ok = 0;
  for (const f of list) {
    try {
      toast('Laster opp bilde …');
      const blob = await shrink(f);
      const sti = `${boardId}/${cardId}/${uid()}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(sti, blob, { contentType: 'image/jpeg' });
      if (fail(up.error, 'kunne ikke laste opp bildet')) continue;
      const { data, error } = await sb.from('oppg_vedlegg').insert({ kort_id: cardId, tavle_id: boardId, sti, bruker_id: me.id }).select().single();
      if (fail(error, 'kunne ikke lagre bildet')) { await sb.storage.from(BUCKET).remove([sti]); continue; }
      files.push(data); ok++;
    } catch (e) { console.error(e); toast('Feil: kunne ikke lese bildet'); }
  }
  if (ok) { toast(ok === 1 ? 'Bilde lagt til' : `${ok} bilder lagt til`); logAct('kommentar', ok === 1 ? '📷 la til et bilde' : `📷 la til ${ok} bilder`, card); }
  render();
}
async function removePhoto(fid) {
  const f = files.find(x => x.id === fid); if (!f) return;
  const { error } = await sb.from('oppg_vedlegg').delete().eq('id', fid);
  if (fail(error, 'kunne ikke slette bildet')) return;
  await sb.storage.from(BUCKET).remove([f.sti]);
  files = files.filter(x => x.id !== fid); render();
}
function viewPhoto(url) {
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${esc(url)}" alt=""><button aria-label="Lukk">✕</button>`;
  v.onclick = () => v.remove();
  const onKey = e => { if (e.key === 'Escape') { v.remove(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey); document.body.appendChild(v);
}

async function loadActivity() {

function actText(a) {

function matches(c) {

function cardHtml(c, isLast, today) {
  const lbl = LABELS.find(l => l.k === c.etikett);

/* ---------- Dra og slipp ---------- */
async function onDrop(evt) {
  const id = evt.item.dataset.id, toCol = evt.to.dataset.col;
  const sibs = [...evt.to.children].filter(el => el.classList.contains('card'));
  const i = sibs.indexOf(evt.item);
  const pos = el => cards.find(c => c.id === el.dataset.id).posisjon;
  const prev = sibs[i - 1], next = sibs[i + 1];
  let p;
  if (prev && next) p = (pos(prev) + pos(next)) / 2;
  else if (prev) p = pos(prev) + STEP;
  else if (next) p = pos(next) - STEP;
  else p = STEP;
  const c = cards.find(x => x.id === id);
  c.kolonne_id = toCol; c.posisjon = p;
  dragging = false; lastDrop = Date.now(); document.body.classList.remove('dragging'); render();
  const { error } = await sb.from('oppg_kort').update({ kolonne_id: toCol, posisjon: p, oppdatert: new Date().toISOString() }).eq('id', id);
  fail(error, 'kunne ikke flytte kortet');
  if (!error && evt.from !== evt.to) { const col = cols.find(k => k.id === toCol); logAct('flyttet', col ? col.tittel : '', c); if (col && col.wip_grense && cards.filter(x => x.kolonne_id === toCol).length > col.wip_grense) toast(`Over grensen i «${col.tittel}» (${col.wip_grense})`); }
}

/* ---------- Kort ---------- */
function nextPos(colId) {
  const ps = cards.filter(c => c.kolonne_id === colId).map(c => c.posisjon);
  return (ps.length ? Math.max(...ps) : 0) + STEP;
}
async function addCard(colId, tittel) {
  tittel = tittel.trim(); if (!tittel) return;
  const row = { tavle_id: boardId, kolonne_id: colId, tittel, posisjon: nextPos(colId), ansvarlig: onlyMine ? me.id : null };
  const { data, error } = await sb.from('oppg_kort').insert(row).select().single();

  cards.push(data); render(); logAct('opprettet', '', data);
}

/* ---------- Kolonner og tavler ---------- */
function colMenu(id) {
  const col = cols.find(c => c.id === id), i = cols.indexOf(col);
  const opts = [{ label: 'Gi nytt navn', fn: async () => { const v = prompt('Nytt navn på kolonnen:', col.tittel); if (v && v.trim()) { const { error } = await sb.from('oppg_kolonner').update({ tittel: v.trim() }).eq('id', id); if (!fail(error)) { col.tittel = v.trim(); render(); } } } }];
  opts.push({ label: 'Velg farge', fn: () => colColor(col) });
  opts.push({ label: col.wip_grense ? `Kolonnegrense: ${col.wip_grense} (endre)` : 'Sett kolonnegrense', fn: async () => {
    const v = prompt('Maks antall kort i kolonnen (tomt = ingen grense):', col.wip_grense || ''); if (v === null) return;
    const n = v.trim() === '' ? null : parseInt(v, 10); if (n !== null && !(n > 0)) return toast('Skriv et positivt tall');
    const { error } = await sb.from('oppg_kolonner').update({ wip_grense: n }).eq('id', id); if (!fail(error)) { col.wip_grense = n; render(); }
  } });
  if (i > 0) opts.push({ label: 'Flytt til venstre', fn: () => moveCol(i, -1) });

  opts.push({ label: 'Slett kolonne (og kortene i den)', danger: true, fn: async () => {
    if (!confirm(`Slette «${col.tittel}» og alle kort i den?`)) return;

    if (!fail(error)) { cols = cols.filter(c => c.id !== id); cards = cards.filter(c => c.kolonne_id !== id); render(); }
  } });
  sheet(col.tittel, opts);
}
function colColor(col) {
  const m = showModal(`<h2>Farge på «${esc(col.tittel)}»</h2><div class="colors"><button type="button" class="none ${!col.farge ? 'sel' : ''}" data-c="">Ingen</button>${COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" class="${c === col.farge ? 'sel' : ''}"></button>`).join('')}</div>`);
  m.querySelectorAll('.colors button').forEach(b => b.onclick = async () => {

  });
}
async function moveCol(i, dir) {
  const a = cols[i], b = cols[i + dir];
  [a.posisjon, b.posisjon] = [b.posisjon, a.posisjon];
  cols.sort((x, y) => x.posisjon - y.posisjon); render();
  const r = await Promise.all([sb.from('oppg_kolonner').update({ posisjon: a.posisjon }).eq('id', a.id), sb.from('oppg_kolonner').update({ posisjon: b.posisjon }).eq('id', b.id)]);
  r.forEach(x => fail(x.error));
}
async function addColumn() {
  const v = prompt('Navn på ny kolonne:'); if (!v || !v.trim()) return;
  const pos = (cols.length ? Math.max(...cols.map(c => c.posisjon)) : 0) + STEP;
  const { data, error } = await sb.from('oppg_kolonner').insert({ tavle_id: boardId, tittel: v.trim(), posisjon: pos }).select().single();
  if (!fail(error)) { cols.push(data); render(); }
}
function boardMenu() {
  const opts = boards.map(b => ({ label: b.navn, cur: b.id === boardId, fn: async () => { boardId = b.id; store.set('oppg_tavle', boardId); await loadBoard(); } }));
  opts.push({ label: '+ Ny tavle', fn: async () => { const v = prompt('Navn på ny tavle:'); if (v && v.trim()) createBoard(v.trim()); } });
  opts.push({ label: 'Gi denne tavlen nytt navn', fn: async () => { const b = boards.find(x => x.id === boardId); const v = prompt('Nytt navn:', b.navn); if (v && v.trim()) { const { error } = await sb.from('oppg_tavler').update({ navn: v.trim() }).eq('id', boardId); if (!fail(error)) { b.navn = v.trim(); render(); } } } });
  if (boards.length > 1) opts.push({ label: 'Slett denne tavlen', danger: true, fn: async () => {
    const b = boards.find(x => x.id === boardId);
    if (!confirm(`Slette tavlen «${b.navn}» med alle kort?`)) return;
    const { error } = await sb.from('oppg_tavler').delete().eq('id', boardId);
    if (fail(error)) return;
    boards = boards.filter(x => x.id !== boardId); boardId = boards[0].id; store.set('oppg_tavle', boardId); await loadBoard();
  } });
  sheet('Tavler', opts);
}
function meMenu() {
  sheet(me.navn, [
    { label: 'Aktivitet', fn: showActivity },
    { label: 'Eksporter tavle (JSON)', fn: () => exportBoard('json') },
    { label: 'Eksporter tavle (CSV)', fn: () => exportBoard('csv') },
    { label: 'Legg til person', fn: addPerson },
    { label: 'Tema: ' + THEME_NAME[store.get('oppg_tema') || 'auto'] + ' (trykk for å bytte)', fn: cycleTheme },
    { label: 'Logg ut', danger: true, fn: logout }
  ]);
}

/* ---------- Hendelser ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const card = t.closest('.card'); if (card) { if (!dragging && Date.now() - lastDrop > 400) openCard(card.dataset.id); return; }
  const cm = t.closest('[data-colmenu]'); if (cm) return colMenu(cm.dataset.colmenu);
  const ao = t.closest('[data-addopen]');
  if (ao) {
    const colId = ao.dataset.addopen, wrap = ao.parentElement;
    wrap.innerHTML = `<form><textarea rows="2" placeholder="Tittel på kortet …" style="min-height:56px"></textarea><div class="row"><button class="btn primary">Legg til</button><button type="button" class="btn" data-addcancel>Avbryt</button></div></form>`;
    const ta = $('textarea', wrap); ta.focus();
    ta.onkeydown = ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('form', wrap).requestSubmit(); } };
    $('form', wrap).onsubmit = async ev => { ev.preventDefault(); const v = ta.value; await addCard(colId, v); const w = document.querySelector(`.col[data-col="${colId}"] .add button`); if (w) w.click(); };
    return;
  }
  if (t.closest('[data-addcancel]')) return render();
  if (t.closest('#newColBtn')) return addColumn();
});
$('#boardBtn').onclick = boardMenu;
$('#meBtn').onclick = meMenu;
$('#themeBtn').onclick = cycleTheme;
$('#logoutBtn').onclick = () => { if (confirm('Logge ut?')) logout(); };
$('#searchBtn').onclick = () => { const bar = $('#searchBar'); bar.classList.toggle('hidden'); if (!bar.classList.contains('hidden')) $('#searchIn').focus(); else { query = ''; $('#searchIn').value = ''; render(); } };
$('#searchIn').oninput = e => { query = e.target.value.trim(); render(); };
$('#searchClear').onclick = () => { query = ''; $('#searchIn').value = ''; $('#searchBar').classList.add('hidden'); render(); };
function exportBoard(fmt) {
  const b = boards.find(x => x.id === boardId), name = (b ? b.navn : 'tavle').replace(/[^\wæøåÆØÅ-]+/g, '_');
  const rows = cards.map(c => ({ kolonne: (cols.find(k => k.id === c.kolonne_id) || {}).tittel || '', tittel: c.tittel, beskrivelse: c.beskrivelse || '', ansvarlig: (userById(c.ansvarlig) || {}).navn || '', frist: c.frist || '', etikett: (LABELS.find(l => l.k === c.etikett) || {}).n || '', sjekkliste: (Array.isArray(c.sjekkliste) ? c.sjekkliste : []).map(x => (x.d ? '[x] ' : '[ ] ') + x.t).join(' | ') }));
  let text, type;
  if (fmt === 'json') { text = JSON.stringify({ tavle: b && b.navn, eksportert: new Date().toISOString(), kolonner: cols, kort: cards, aktivitet: activity }, null, 2); type = 'application/json'; }
  else { const q = v => '"' + String(v).replace(/"/g, '""') + '"', h = Object.keys(rows[0] || { kolonne: 1, tittel: 1, beskrivelse: 1, ansvarlig: 1, frist: 1, etikett: 1, sjekkliste: 1 }); text = '\ufeff' + [h.join(';'), ...rows.map(r => h.map(k => q(r[k])).join(';'))].join('\r\n'); type = 'text/csv'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' })); a.download = `${name}.${fmt}`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#mineBtn').onclick = () => { onlyMine = !onlyMine; render(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) scheduleLoad(); });

/* ---------- Oppstart ---------- */
(async function init() {
  applyTheme(store.get('oppg_tema') || 'auto');
  boardId = store.get('oppg_tavle');
  try { me = JSON.parse(store.get('oppg_meg') || sess.get('oppg_meg') || 'null'); } catch { me = null; }
  if (me && me.id) { $('#login').classList.add('hidden'); start(); } else showLogin();
})();
</script>
</body>
